proto:
  version: "0.57.0"

go:
  versionFromPrototools: true

javascript:
  packageManager: "pnpm"
  installDependencies: true

node:
  versionFromPrototools: true

npm:
  versionFromPrototools: true

pnpm:
  versionFromPrototools: true

# IMPORTANT: moon currently requires "unstable_" prefix.
# See <https://moonrepo.dev/docs/config/toolchain#python>
unstable_python:
  packageManager: "uv"
  venvName: ".venv"
  versionFromPrototools: "python"

# IMPORTANT: moon currently requires "unstable_" prefix.
# See <https://moonrepo.dev/docs/config/toolchain#python>
unstable_uv:
  versionFromPrototools: "uv"
