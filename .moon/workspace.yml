projects:
  sources:
    repo: "."
    go-net-http-rest: "stacks/go/net-http/rest"
    nodejs-react-fastify-rest: "stacks/nodejs/react-fastify/rest"
    contract-tests: "tests"
    docs-site: "docs"
    mcp-tools: "tools/mcp"

defaultProject: "repo"
versionConstraint: ">=2.1.3"
telemetry: false

vcs:
  client: "git"
  provider: "github"
  defaultBranch: "main"
  remoteCandidates:
    - "upstream"
    - "origin"

pipeline:
  installDependencies: true
  syncWorkspace: false
  syncProjects: false
