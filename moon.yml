language: "javascript"
layer: "tool"
stack: "infrastructure"

project:
  title: "repo"
  description: "Root orchestration, validation, and workflow utility tasks for IDP."

tasks:
  install:
    command: ["pnpm", "install"]
    options:
      runFromWorkspaceRoot: true
  check-lint-md:
    command: ["pnpm", "run", "lint:md"]
    options:
      runFromWorkspaceRoot: true
  clean:
    command:
      - "bash"
      - "-c"
      - >-
        moon run go-net-http-rest:clean nodejs-react-fastify-rest:clean docs-site:clean mcp-tools:clean mock-oauth:clean vscode-extension:clean backstage-tools:clean &&
        (make -C tools/gitlab-harness down 2>/dev/null || true) &&
        (make -C tools/gitlab-harness clean 2>/dev/null || true) &&
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then docker image prune -f --filter "label=org.opencontainers.image.created-by=moon" 2>/dev/null || true; fi
    options:
      runFromWorkspaceRoot: true
  reset:
    command:
      - "bash"
      - "-c"
      - >-
        moon run repo:clean &&
        rm -rf .venv/ .pnpm-store/ node_modules/ docs/node_modules/ stacks/go/net-http/rest/node_modules/ stacks/nodejs/react-fastify/rest/node_modules/ tools/vscode-extension/node_modules/ tools/backstage/node_modules/ tools/mcp/node_modules/ tools/mock-providers/node_modules/ tools/mock-oauth/target/
    options:
      runFromWorkspaceRoot: true
  check-lint-workflows:
    command: ["bash", "./scripts/ci/check-lint-workflows.sh"]
    options:
      runFromWorkspaceRoot: true
  check-privacy:
    command: ["bash", "./scripts/ci/check-privacy.sh"]
    options:
      runFromWorkspaceRoot: true
  upgrade:
    command: ["bash", "./scripts/ci/upgrade-dependencies.sh"]
    options:
      runFromWorkspaceRoot: true
  check-team-membership:
    command: ["bash", "./scripts/ci/check-team-membership.sh"]
    options:
      runFromWorkspaceRoot: true
  check-pr-changes:
    command: ["bash", "./scripts/ci/detect-pr-changes.sh"]
    options:
      runFromWorkspaceRoot: true
  issue-number:
    command: ["bash", "./scripts/ci/issue-number-from-dispatch.sh"]
    options:
      runFromWorkspaceRoot: true
  issue-triage:
    command: ["bash", "./scripts/ci/issue-triage.sh"]
    options:
      runFromWorkspaceRoot: true
  issue-signal-ready:
    command: ["bash", "./scripts/ci/issue-signal-ready.sh"]
    options:
      runFromWorkspaceRoot: true
  issue-setup-labels:
    command: ["bash", "./scripts/ci/setup-labels.sh"]
    options:
      runFromWorkspaceRoot: true
  worktree-path:
    command: ["bash", "./scripts/ci/worktree-path.sh"]
    options:
      runFromWorkspaceRoot: true
  worktree-ensure:
    command: ["bash", "./scripts/ci/worktree-ensure.sh"]
    options:
      runFromWorkspaceRoot: true
  worktree-cleanup:
    command: ["bash", "./scripts/ci/worktree-cleanup.sh"]
    options:
      runFromWorkspaceRoot: true
  audit-worktrees:
    command: ["bash", "./scripts/ci/audit-worktrees.sh"]
    options:
      runFromWorkspaceRoot: true
  check:
    command: ["bash", "-c", "true"]
    deps: ["~:check-lint-md"]
    options:
      runFromWorkspaceRoot: true
  ci:
    command: ["bash", "-c", "moon ci go-net-http-rest:check-ci nodejs-react-fastify-rest:check-ci docs-site:check-ci"]
    options:
      runFromWorkspaceRoot: true
  dev:
    command: ["bash", "-c", "moon run go-net-http-rest:run-web go-net-http-rest:run-bff"]
    options:
      runFromWorkspaceRoot: true
      persistent: true
