language: "typescript"
layer: "application"
stack: "frontend"

project:
  title: "nodejs-react-fastify-rest"
  description: "React + Fastify TypeScript reference stack for IDP."

tasks:
  all:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check"]
  install:
    command: ["bash", "-c", "npm --prefix ../../../.. install && npm install"]
  build:
    command: ["npm", "run", "build:web"]
    deps: ["install"]
  clean:
    command: ["bash", "-c", "rm -rf web/dist"]
  check-lint:
    command: ["npm", "run", "lint:md"]
    deps: ["install"]
  check-test:
    command: ["npm", "run", "test:stack"]
    deps: ["install"]
  check-contract:
    command: ["uv", "run", "python", "../../../../scripts/ci/run-contract-check.py"]
    deps: ["build", "check-test", "build-mock-oauth"]
    env:
      OUR_IDP_STACK_PATH: "stacks/nodejs/react-fastify/rest"
      OUR_IDP_WEB_START_CMD: "OUR_IDP_WEB_HOST=127.0.0.1 OUR_IDP_PORT=3400 npm run start:web"
      OUR_IDP_BFF_START_CMD: >-
        OUR_IDP_API_HOST=127.0.0.1
        OUR_IDP_API_PORT=8400
        OUR_IDP_STATUS_WEB_URL=http://127.0.0.1:3400
        npm run start:bff
      OUR_IDP_OAUTH_PROVIDER: "mock"
      OUR_IDP_OAUTH_MOCK_PORT: "9000"
      OUR_IDP_OAUTH_CLIENT_ID: "mock-client-id"
      OUR_IDP_OAUTH_CLIENT_SECRET: "mock-client-secret"
      OUR_IDP_OAUTH_REDIRECT_URL: "http://127.0.0.1:8400/auth/callback"
      OUR_IDP_MOCK_OAUTH_START_CMD: "java -jar ../../../../tools/mock-oauth/target/mock-oauth.jar"
      OUR_IDP_MOCK_OAUTH_URL: "http://127.0.0.1:9000"
      OUR_IDP_WEB_URL: "http://127.0.0.1:3400"
      OUR_IDP_BFF_URL: "http://127.0.0.1:8400"
      OUR_IDP_CONTRACT_PROFILES: "core,operational,status-profile,ui-profile"
      OUR_IDP_ROOT_DIR: "../../../.."
  check-ci:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check-lint", "check-test"]
    options:
      runInCI: true
  check:
    command: ["bash", "-c", "true"]
    deps: ["check-lint", "check-test", "check-contract"]
  test:
    command: ["bash", "-c", "true"]
    deps: ["check-test"]
  test-contract:
    command: ["bash", "-c", "true"]
    deps: ["check-contract"]
  e2e:
    command: ["bash", "../../../../scripts/e2e/run-stack-e2e.sh"]
    env:
      OUR_IDP_STACK_PATH: "stacks/nodejs/react-fastify/rest"
      OUR_IDP_WEB_START_CMD: "OUR_IDP_WEB_HOST=127.0.0.1 OUR_IDP_PORT=3400 npm run start:web"
      OUR_IDP_BFF_START_CMD: "OUR_IDP_API_HOST=127.0.0.1 OUR_IDP_API_PORT=8400 OUR_IDP_STATUS_WEB_URL=http://127.0.0.1:3400 npm run start:bff"
      OUR_IDP_WEB_URL: "http://127.0.0.1:3400"
      OUR_IDP_BFF_URL: "http://127.0.0.1:8400"
      OUR_IDP_CONTRACT_PROFILES: "core,operational,status-profile,ui-profile"
      OUR_IDP_ROOT_DIR: "../../../.."
  run-web:
    command: ["npm", "run", "start:web"]
    options:
      persistent: true
      runInCI: false
  run-bff:
    command: ["npm", "run", "start:bff"]
    options:
      persistent: true
      runInCI: false
  build-mock-oauth:
    command: ["bash", "-c", "true"]
    deps:
      - "mock-oauth:build"
  check-contract-auth:
    command: ["uv", "run", "python", "../../../../scripts/ci/run-contract-check.py"]
    deps: ["build", "build-mock-oauth"]
    env:
      OUR_IDP_STACK_PATH: "stacks/nodejs/react-fastify/rest"
      OUR_IDP_WEB_START_CMD: "OUR_IDP_WEB_HOST=127.0.0.1 OUR_IDP_PORT=3400 npm run start:web"
      OUR_IDP_BFF_START_CMD: >-
        OUR_IDP_API_HOST=127.0.0.1
        OUR_IDP_API_PORT=8400
        OUR_IDP_STATUS_WEB_URL=http://127.0.0.1:3400
        OUR_IDP_OAUTH_PROVIDER=mock
        OUR_IDP_OAUTH_MOCK_PORT=9000
        OUR_IDP_OAUTH_CLIENT_ID=mock-client-id
        OUR_IDP_OAUTH_CLIENT_SECRET=mock-client-secret
        OUR_IDP_OAUTH_REDIRECT_URL=http://127.0.0.1:8400/auth/callback
        npm run start:bff
      OUR_IDP_OAUTH_PROVIDER: "mock"
      OUR_IDP_OAUTH_MOCK_PORT: "9000"
      OUR_IDP_OAUTH_CLIENT_ID: "mock-client-id"
      OUR_IDP_OAUTH_CLIENT_SECRET: "mock-client-secret"
      OUR_IDP_OAUTH_REDIRECT_URL: "http://127.0.0.1:8400/auth/callback"
      OUR_IDP_MOCK_OAUTH_START_CMD: "java -jar ../../../../tools/mock-oauth/target/mock-oauth.jar"
      OUR_IDP_MOCK_OAUTH_URL: "http://127.0.0.1:9000"
      OUR_IDP_WEB_URL: "http://127.0.0.1:3400"
      OUR_IDP_BFF_URL: "http://127.0.0.1:8400"
      OUR_IDP_CONTRACT_PROFILES: "auth-profile"
      OUR_IDP_ROOT_DIR: "../../../.."
  build-container-web:
    command: ["docker", "build", "--progress=plain", "-t", "localhost/stemix-nodejs-react-fastify-rest-web:latest", "-f", "web/Dockerfile", "../../../.."]
    options:
      runInCI: false
  build-container-bff:
    command: ["docker", "build", "--progress=plain", "-t", "localhost/stemix-nodejs-react-fastify-rest-bff:latest", "-f", "bff/Dockerfile", "../../../.."]
    options:
      runInCI: false
  build-containers:
    command: ["bash", "-c", "true"]
    deps: ["build-container-web", "build-container-bff"]
    options:
      runInCI: false
