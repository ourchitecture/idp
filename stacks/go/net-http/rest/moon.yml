language: "go"
layer: "application"
stack: "backend"

project:
  title: "go-net-http-rest"
  description: "Default Go net/http REST stack for IDP."

tasks:
  all:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check"]
  install:
    command: ["go", "mod", "download"]
  build-web:
    command: ["bash", "-c", "mkdir -p .bin && go build -o .bin/idp-go-web ./web"]
  build-bff:
    command: ["bash", "-c", "mkdir -p .bin && go build -o .bin/idp-go-bff ./bff"]
  build:
    command: ["bash", "-c", "true"]
    deps: ["build-web", "build-bff"]
  setup-debug-tools:
    command: ["bash", "-c", "mkdir -p .bin && GOBIN=\"$(pwd)/.bin\" go install -v github.com/go-delve/delve/cmd/dlv@v1.25.2"]
  build-debug-web:
    command: ["bash", "-c", "mkdir -p .bin && go build -gcflags='all=-N -l' -o .bin/idp-go-web ./web"]
    deps: ["setup-debug-tools"]
  build-debug-bff:
    command: ["bash", "-c", "mkdir -p .bin && go build -gcflags='all=-N -l' -o .bin/idp-go-bff ./bff"]
    deps: ["setup-debug-tools"]
  clean:
    command: ["bash", "-c", "rm -rf .bin"]
  check-lint:
    command: ["go", "vet", "./..."]
  check-test:
    command: ["go", "test", "./..."]
  check-contract:
    command: ["uv", "run", "python", "../../../../scripts/ci/run-contract-check.py"]
    deps: ["build"]
    env:
      OUR_IDP_STACK_PATH: "stacks/go/net-http/rest"
      OUR_IDP_WEB_START_CMD: "OUR_IDP_WEB_HOST=127.0.0.1 OUR_IDP_PORT=3300 go run ./web"
      OUR_IDP_BFF_START_CMD: "OUR_IDP_API_HOST=127.0.0.1 OUR_IDP_API_PORT=8300 OUR_IDP_STATUS_WEB_URL=http://127.0.0.1:3300 go run ./bff"
      OUR_IDP_WEB_URL: "http://127.0.0.1:3300"
      OUR_IDP_BFF_URL: "http://127.0.0.1:8300"
      OUR_IDP_ROOT_DIR: "../../../.."
  check-ci:
    command: ["bash", "-c", "true"]
    deps: ["build", "check-lint", "check-test"]
    options:
      runInCI: true
  check:
    command: ["bash", "-c", "true"]
    deps: ["check-lint", "check-test", "check-contract"]
  test:
    command: ["bash", "-c", "true"]
    deps: ["check-test"]
  test-contract:
    command: ["bash", "-c", "true"]
    deps: ["check-contract"]
  run-web:
    command: ["go", "run", "./web"]
    options:
      persistent: true
      runInCI: false
  run-bff:
    command: ["go", "run", "./bff"]
    env:
      OUR_IDP_OAUTH_PROVIDER: "mock"
      OUR_IDP_OAUTH_CLIENT_ID: "mock-client-id"
      OUR_IDP_OAUTH_CLIENT_SECRET: "mock-client-secret"
      OUR_IDP_OAUTH_REDIRECT_URL: "http://127.0.0.1:8000/auth/callback"
    options:
      persistent: true
      runInCI: false
  build-container-web:
    command: ["docker", "build", "--build-arg", "SERVICE=web", "-t", "localhost/stemix-go-net-http-rest-web:latest", "-f", "Dockerfile", "."]
    options:
      runInCI: false
  build-container-bff:
    command: ["docker", "build", "--build-arg", "SERVICE=bff", "-t", "localhost/stemix-go-net-http-rest-bff:latest", "-f", "Dockerfile", "."]
    options:
      runInCI: false
  build-containers:
    command: ["bash", "-c", "true"]
    deps: ["build-container-web", "build-container-bff"]
    options:
      runInCI: false
  check-java:
    command:
      - "bash"
      - "-c"
      - >-
        command -v java >/dev/null 2>&1 ||
        { echo 'ERROR: java is required but not found in PATH.
        Install Java 21+: https://adoptium.net/' >&2; exit 1; }
  build-mock-oauth:
    command: ["bash", "-c", "true"]
    deps:
      - "check-java"
      - "mock-oauth:build"
  check-contract-auth:
    command: ["uv", "run", "python", "../../../../scripts/ci/run-contract-check.py"]
    deps: ["build", "build-mock-oauth"]
    env:
      OUR_IDP_STACK_PATH: "stacks/go/net-http/rest"
      OUR_IDP_WEB_START_CMD: "OUR_IDP_WEB_HOST=127.0.0.1 OUR_IDP_PORT=3300 env -- .bin/idp-go-web"
      OUR_IDP_BFF_START_CMD: >-
        OUR_IDP_API_HOST=127.0.0.1
        OUR_IDP_API_PORT=8300
        OUR_IDP_STATUS_WEB_URL=http://127.0.0.1:3300
        OUR_IDP_OAUTH_PROVIDER=mock
        OUR_IDP_OAUTH_MOCK_PORT=9000
        OUR_IDP_OAUTH_CLIENT_ID=mock-client-id
        OUR_IDP_OAUTH_CLIENT_SECRET=mock-client-secret
        OUR_IDP_OAUTH_REDIRECT_URL=http://127.0.0.1:8300/auth/callback
        env -- .bin/idp-go-bff
      OUR_IDP_OAUTH_PROVIDER: "mock"
      OUR_IDP_OAUTH_MOCK_PORT: "9000"
      OUR_IDP_OAUTH_CLIENT_ID: "mock-client-id"
      OUR_IDP_OAUTH_CLIENT_SECRET: "mock-client-secret"
      OUR_IDP_OAUTH_REDIRECT_URL: "http://127.0.0.1:8300/auth/callback"
      OUR_IDP_MOCK_OAUTH_START_CMD: "java -jar ../../../../tools/mock-oauth/target/mock-oauth.jar"
      OUR_IDP_MOCK_OAUTH_URL: "http://127.0.0.1:9000"
      OUR_IDP_WEB_URL: "http://127.0.0.1:3300"
      OUR_IDP_BFF_URL: "http://127.0.0.1:8300"
      OUR_IDP_CONTRACT_PROFILES: "auth-profile"
      OUR_IDP_ROOT_DIR: "../../../.."
