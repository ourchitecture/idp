name: Privacy Scan Weekly

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PROTO_VERSION: "0.55.4"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  privacy-scan:
    name: Privacy and Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Restore proto and moon cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Restore npm cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Restore Python cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/ci/check-privacy.sh') }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run privacy scan
        run: moon run repo:check-privacy

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Save Python cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/ci/check-privacy.sh') }}
