name: PR Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PROTO_VERSION: "0.55.4"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      changed_count: ${{ steps.detect.outputs.changed_count }}
      markdown_only: ${{ steps.detect.outputs.markdown_only }}
      run_markdown: ${{ steps.detect.outputs.run_markdown }}
      run_workflow_lint: ${{ steps.detect.outputs.run_workflow_lint }}
      run_stack_validation: ${{ steps.detect.outputs.run_stack_validation }}
      stack_matrix: ${{ steps.detect.outputs.stack_matrix }}
      run_docs_validation: ${{ steps.detect.outputs.run_docs_validation }}
      run_go_containers: ${{ steps.detect.outputs.run_go_containers }}
      run_node_containers: ${{ steps.detect.outputs.run_node_containers }}
      run_mcp_containers: ${{ steps.detect.outputs.run_mcp_containers }}
      run_tests_container: ${{ steps.detect.outputs.run_tests_container }}
      run_any_containers: ${{ steps.detect.outputs.run_any_containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Detect intelligent validation plan
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export BASE_SHA="${BASE_SHA}"
          export HEAD_SHA="${HEAD_SHA}"
          export OUTPUT_FILE="$GITHUB_OUTPUT"
          moon run repo:check-pr-changes

      - name: Print validation plan
        run: |
          echo "changed_count=${{ steps.detect.outputs.changed_count }}"
          echo "markdown_only=${{ steps.detect.outputs.markdown_only }}"
          echo "run_markdown=${{ steps.detect.outputs.run_markdown }}"
          echo "run_workflow_lint=${{ steps.detect.outputs.run_workflow_lint }}"
          echo "run_stack_validation=${{ steps.detect.outputs.run_stack_validation }}"
          echo "stack_matrix=${{ steps.detect.outputs.stack_matrix }}"
          echo "run_docs_validation=${{ steps.detect.outputs.run_docs_validation }}"
          echo "run_go_containers=${{ steps.detect.outputs.run_go_containers }}"
          echo "run_node_containers=${{ steps.detect.outputs.run_node_containers }}"
          echo "run_mcp_containers=${{ steps.detect.outputs.run_mcp_containers }}"
          echo "run_tests_container=${{ steps.detect.outputs.run_tests_container }}"
          echo "run_any_containers=${{ steps.detect.outputs.run_any_containers }}"

  check-lint-md:
    name: Check Lint Markdown
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_markdown == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run markdown lint checks
        run: moon run repo:check-lint-md

  check-workflow-files:
    name: Check Workflow Files
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_workflow_lint == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run workflow lint checks
        run: moon run repo:check-lint-workflows

  check-stack-matrix:
    name: Check Stack (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_stack_validation == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.stack_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run stack CI-safe checks
        run: moon run "${{ matrix.project }}:check-ci"

  check-docs-site:
    name: Check Docs Site
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_docs_validation == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run docs site CI-safe checks
        run: moon run docs-site:check-ci

  validate-commit-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Check PR author team membership
        id: author-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          USERNAME: ${{ github.event.pull_request.user.login }}
          TEAM_SLUGS: idp-admin,idp-maintain
        run: |
          export ORG="${ORG}"
          export USERNAME="${USERNAME}"
          export TEAM_SLUGS="${TEAM_SLUGS}"
          export OUTPUT_FILE="$GITHUB_OUTPUT"
          moon run repo:check-team-membership

      - name: Validate PR title as Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          IS_TEAM_MEMBER: ${{ steps.author-check.outputs.is_team_member }}
        run: |
          export PR_TITLE="${PR_TITLE}"
          export IS_TEAM_MEMBER="${IS_TEAM_MEMBER}"
          moon run repo:check-pr-title

  check-container-build:
    name: Check Container Build
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_any_containers == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go web container
        if: needs.detect-changes.outputs.run_go_containers == 'true'
        run: |
          docker build \
            --build-arg SERVICE=web \
            -t stemix-go-web:pr-check \
            -f stacks/go/net-http/rest/Dockerfile \
            stacks/go/net-http/rest

      - name: Build Go BFF container
        if: needs.detect-changes.outputs.run_go_containers == 'true'
        run: |
          docker build \
            --build-arg SERVICE=bff \
            -t stemix-go-bff:pr-check \
            -f stacks/go/net-http/rest/Dockerfile \
            stacks/go/net-http/rest

      - name: Build Node.js web container
        if: needs.detect-changes.outputs.run_node_containers == 'true'
        run: |
          docker build \
            -t stemix-node-web:pr-check \
            -f stacks/nodejs/react-fastify/rest/web/Dockerfile \
            .

      - name: Build Node.js BFF container
        if: needs.detect-changes.outputs.run_node_containers == 'true'
        run: |
          docker build \
            -t stemix-node-bff:pr-check \
            -f stacks/nodejs/react-fastify/rest/bff/Dockerfile \
            .

      - name: Build contract tests container
        if: needs.detect-changes.outputs.run_tests_container == 'true'
        run: |
          docker build \
            -t stemix-contract-tests:pr-check \
            -f tests/Dockerfile \
            .

      - name: Build MCP server container
        if: needs.detect-changes.outputs.run_mcp_containers == 'true'
        run: |
          docker build \
            -t stemix-mcp-server:pr-check \
            -f tools/mcp/Dockerfile \
            tools/mcp

  pr-validation-result:
    name: PR Validation Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - check-lint-md
      - check-workflow-files
      - check-stack-matrix
      - check-docs-site
      - validate-commit-message
      - check-container-build
    steps:
      - name: Verify required checks
        run: |
          result_detect="${{ needs.detect-changes.result }}"
          result_lint_md="${{ needs.check-lint-md.result }}"
          result_workflows="${{ needs.check-workflow-files.result }}"
          result_stack="${{ needs.check-stack-matrix.result }}"
          result_docs="${{ needs.check-docs-site.result }}"
          result_commit="${{ needs.validate-commit-message.result }}"
          result_containers="${{ needs.check-container-build.result }}"

          if [[ "${result_detect}" != "success" ]]; then
            echo "::error::detect-changes failed (${result_detect})"
            exit 1
          fi

          if [[ "${result_commit}" != "success" ]]; then
            echo "::error::validate-commit-message failed (${result_commit})"
            exit 1
          fi

          if [[ "${result_lint_md}" != "success" && "${result_lint_md}" != "skipped" ]]; then
            echo "::error::check-lint-md failed (${result_lint_md})"
            exit 1
          fi

          if [[ "${result_workflows}" != "success" && "${result_workflows}" != "skipped" ]]; then
            echo "::error::check-workflow-files failed (${result_workflows})"
            exit 1
          fi

          if [[ "${result_stack}" != "success" && "${result_stack}" != "skipped" ]]; then
            echo "::error::check-stack-matrix failed (${result_stack})"
            exit 1
          fi

          if [[ "${result_docs}" != "success" && "${result_docs}" != "skipped" ]]; then
            echo "::error::check-docs-site failed (${result_docs})"
            exit 1
          fi

          if [[ "${result_containers}" != "success" && "${result_containers}" != "skipped" ]]; then
            echo "::error::check-container-build failed (${result_containers})"
            exit 1
          fi

          echo "All required PR validation checks completed successfully."
