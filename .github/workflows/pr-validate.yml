name: PR Validate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTO_VERSION: "0.55.4"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      changed_count: ${{ steps.detect.outputs.changed_count }}
      markdown_only: ${{ steps.detect.outputs.markdown_only }}
      run_markdown: ${{ steps.detect.outputs.run_markdown }}
      run_workflow_lint: ${{ steps.detect.outputs.run_workflow_lint }}
      run_stack_validation: ${{ steps.detect.outputs.run_stack_validation }}
      stack_matrix: ${{ steps.detect.outputs.stack_matrix }}
      run_docs_validation: ${{ steps.detect.outputs.run_docs_validation }}
      run_go_containers: ${{ steps.detect.outputs.run_go_containers }}
      run_node_containers: ${{ steps.detect.outputs.run_node_containers }}
      run_mcp_containers: ${{ steps.detect.outputs.run_mcp_containers }}
      run_tests_container: ${{ steps.detect.outputs.run_tests_container }}
      run_any_containers: ${{ steps.detect.outputs.run_any_containers }}
      run_mock_oauth_build: ${{ steps.detect.outputs.run_mock_oauth_build }}
      run_mock_oauth_containers: ${{ steps.detect.outputs.run_mock_oauth_containers }}
      run_auth_integration: ${{ steps.detect.outputs.run_auth_integration }}
      run_flow_insights_equivalence: ${{ steps.detect.outputs.run_flow_insights_equivalence }}
      run_mock_providers: ${{ steps.detect.outputs.run_mock_providers }}
      run_backstage_tools: ${{ steps.detect.outputs.run_backstage_tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Restore proto and moon cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Restore npm cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Detect intelligent validation plan
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export BASE_SHA="${BASE_SHA}"
          export HEAD_SHA="${HEAD_SHA}"
          export OUTPUT_FILE="$GITHUB_OUTPUT"
          moon run repo:check-pr-changes

      - name: Print validation plan
        run: |
          echo "changed_count=${{ steps.detect.outputs.changed_count }}"
          echo "markdown_only=${{ steps.detect.outputs.markdown_only }}"
          echo "run_markdown=${{ steps.detect.outputs.run_markdown }}"
          echo "run_workflow_lint=${{ steps.detect.outputs.run_workflow_lint }}"
          echo "run_stack_validation=${{ steps.detect.outputs.run_stack_validation }}"
          echo "stack_matrix=${{ steps.detect.outputs.stack_matrix }}"
          echo "run_docs_validation=${{ steps.detect.outputs.run_docs_validation }}"
          echo "run_go_containers=${{ steps.detect.outputs.run_go_containers }}"
          echo "run_node_containers=${{ steps.detect.outputs.run_node_containers }}"
          echo "run_mcp_containers=${{ steps.detect.outputs.run_mcp_containers }}"
          echo "run_tests_container=${{ steps.detect.outputs.run_tests_container }}"
          echo "run_any_containers=${{ steps.detect.outputs.run_any_containers }}"
          echo "run_mock_oauth_build=${{ steps.detect.outputs.run_mock_oauth_build }}"
          echo "run_mock_oauth_containers=${{ steps.detect.outputs.run_mock_oauth_containers }}"
          echo "run_auth_integration=${{ steps.detect.outputs.run_auth_integration }}"
          echo "run_flow_insights_equivalence=${{ steps.detect.outputs.run_flow_insights_equivalence }}"
          echo "run_mock_providers=${{ steps.detect.outputs.run_mock_providers }}"
          echo "run_backstage_tools=${{ steps.detect.outputs.run_backstage_tools }}"

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

  check-lint-md:
    name: Check Lint Markdown
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_markdown == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run markdown lint checks
        run: moon run repo:check-lint-md

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

  check-workflow-files:
    name: Check Workflow Files
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_workflow_lint == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run workflow lint checks
        run: moon run repo:check-lint-workflows

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

  check-stack-matrix:
    name: Check Stack (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.run_stack_validation == 'true'
      && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.stack_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run stack CI-safe checks
        run: moon run "${{ matrix.project }}:check-ci"

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Save Go cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('.prototools', 'stacks/go/net-http/rest/go.mod', 'stacks/go/net-http/rest/go.sum') }}

  check-docs-site:
    name: Check Docs Site
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.run_docs_validation == 'true'
      && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Run docs site CI-safe checks
        run: moon run docs-site:check-ci
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

  check-container-build:
    name: Check Container Build
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.run_any_containers == 'true'
      && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Go web container
        if: needs.detect-changes.outputs.run_go_containers == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: stacks/go/net-http/rest
          file: stacks/go/net-http/rest/Dockerfile
          build-args: SERVICE=web
          load: true
          tags: stemix-go-net-http-rest-web:pr-check
          cache-from: type=gha,scope=go-net-http-rest-web,timeout=10m
          cache-to: type=gha,scope=go-net-http-rest-web,mode=max,ignore-error=true,timeout=10m

      - name: Smoke Go web container
        if: needs.detect-changes.outputs.run_go_containers == 'true'
        env:
          IMAGE: stemix-go-net-http-rest-web:pr-check
          PORT: "3300:3000"
          URL: http://localhost:3300/
        run: bash scripts/ci/smoke-test-container.sh

      - name: Build Go BFF container
        if: needs.detect-changes.outputs.run_go_containers == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: stacks/go/net-http/rest
          file: stacks/go/net-http/rest/Dockerfile
          build-args: SERVICE=bff
          load: true
          tags: stemix-go-net-http-rest-bff:pr-check
          cache-from: type=gha,scope=go-net-http-rest-bff,timeout=10m
          cache-to: type=gha,scope=go-net-http-rest-bff,mode=max,ignore-error=true,timeout=10m

      - name: Smoke Go BFF container
        if: needs.detect-changes.outputs.run_go_containers == 'true'
        env:
          IMAGE: stemix-go-net-http-rest-bff:pr-check
          PORT: "8300:8000"
          URL: http://localhost:8300/health
        run: bash scripts/ci/smoke-test-container.sh

      - name: Build Node.js web container
        if: needs.detect-changes.outputs.run_node_containers == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: stacks/nodejs/react-fastify/rest/web/Dockerfile
          load: true
          tags: stemix-nodejs-react-fastify-rest-web:pr-check
          cache-from: type=gha,scope=nodejs-react-fastify-rest-web,timeout=10m
          cache-to: type=gha,scope=nodejs-react-fastify-rest-web,mode=max,ignore-error=true,timeout=10m

      - name: Smoke Node.js web container
        if: needs.detect-changes.outputs.run_node_containers == 'true'
        env:
          IMAGE: stemix-nodejs-react-fastify-rest-web:pr-check
          PORT: "3400:3000"
          URL: http://localhost:3400/
          DOCKER_ARGS: -e BFF_URL=http://localhost:8400
        run: bash scripts/ci/smoke-test-container.sh

      - name: Build Node.js BFF container
        if: needs.detect-changes.outputs.run_node_containers == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: stacks/nodejs/react-fastify/rest/bff/Dockerfile
          load: true
          tags: stemix-nodejs-react-fastify-rest-bff:pr-check
          cache-from: type=gha,scope=nodejs-react-fastify-rest-bff,timeout=10m
          cache-to: type=gha,scope=nodejs-react-fastify-rest-bff,mode=max,ignore-error=true,timeout=10m

      - name: Smoke Node.js BFF container
        if: needs.detect-changes.outputs.run_node_containers == 'true'
        env:
          IMAGE: stemix-nodejs-react-fastify-rest-bff:pr-check
          PORT: "8400:8000"
          URL: http://localhost:8400/health
        run: bash scripts/ci/smoke-test-container.sh

      - name: Build contract tests container
        if: needs.detect-changes.outputs.run_tests_container == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: stemix-contract-tests:pr-check
          cache-from: type=gha,scope=contract-tests,timeout=10m
          cache-to: type=gha,scope=contract-tests,mode=max,ignore-error=true,timeout=10m

      - name: Build MCP server container
        if: needs.detect-changes.outputs.run_mcp_containers == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: tools/mcp
          file: tools/mcp/Dockerfile
          load: true
          tags: stemix-mcp-server:pr-check
          cache-from: type=gha,scope=mcp-tools,timeout=10m
          cache-to: type=gha,scope=mcp-tools,mode=max,ignore-error=true,timeout=10m

      - name: Smoke MCP server container
        if: needs.detect-changes.outputs.run_mcp_containers == 'true'
        env:
          IMAGE: stemix-mcp-server:pr-check
          PORT: "8580:8080"
          URL: http://localhost:8580/mcp
          CURL_METHOD: POST
          CURL_CONTENT_TYPE: application/json
          CURL_ACCEPT: "application/json, text/event-stream"
          CURL_DATA: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke-test","version":"0.0.1"}}}'
        run: bash scripts/ci/smoke-test-container.sh

      - name: Build mock-oauth container
        if: needs.detect-changes.outputs.run_mock_oauth_containers == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: tools/mock-oauth
          file: tools/mock-oauth/Dockerfile
          load: true
          tags: stemix-mock-oauth:pr-check
          cache-from: type=gha,scope=mock-oauth,timeout=10m
          cache-to: type=gha,scope=mock-oauth,mode=max,ignore-error=true,timeout=10m

      - name: Smoke mock-oauth container
        if: needs.detect-changes.outputs.run_mock_oauth_containers == 'true'
        env:
          IMAGE: stemix-mock-oauth:pr-check
          PORT: "9900:9000"
          URL: http://localhost:9900/health
          POLL_ATTEMPTS: "10"
        run: bash scripts/ci/smoke-test-container.sh

  check-mock-oauth-build:
    name: Check Mock OAuth Build
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.run_mock_oauth_build == 'true'
      && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Setup Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test mock OAuth
        run: moon run mock-oauth:check-ci

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Save Maven cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('tools/mock-oauth/pom.xml', 'tools/mock-oauth/.mvn/wrapper/maven-wrapper.properties', 'tools/mock-oauth/.mvn/wrapper/maven-wrapper.jar') }}

  check-auth-integration:
    name: Check Auth Integration
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.run_auth_integration == 'true'
      && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Setup Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install npm dependencies
        run: npm install

      - name: Run Go auth integration contract tests
        run: make -C stacks/go/net-http/rest check-contract-auth

      - name: Run Node.js auth integration contract tests
        run: make -C stacks/nodejs/react-fastify/rest check-contract-auth

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Save Go cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('.prototools', 'stacks/go/net-http/rest/go.mod', 'stacks/go/net-http/rest/go.sum') }}

  check-flow-insights-equivalence:
    name: Check Flow Insights Equivalence
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.run_flow_insights_equivalence == 'true'
      && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Install npm dependencies
        run: npm install

      - name: Install Node.js BFF dependencies
        run: npm install --prefix stacks/nodejs/react-fastify/rest

      - name: Run cross-stack flow insights equivalence
        run: make check-flow-insights-equivalence

      - name: Upload equivalence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-insights-equivalence
          path: .tmp/flow-insights-equivalence
          if-no-files-found: ignore

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Save Go cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('.prototools', 'stacks/go/net-http/rest/go.mod', 'stacks/go/net-http/rest/go.sum') }}

  check-mock-providers:
    name: Check Mock Providers
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.run_mock_providers == 'true'
      && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Install Node.js BFF dependencies
        run: npm install --prefix stacks/nodejs/react-fastify/rest

      - name: Run mock providers CI-safe checks
        run: moon run mock-providers:check-ci

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

  pr-validation-result:
    name: PR Validation Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - check-lint-md
      - check-workflow-files
      - check-stack-matrix
      - check-docs-site
      - check-container-build
      - check-mock-oauth-build
      - check-auth-integration
      - check-flow-insights-equivalence
      - check-mock-providers
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify required checks
        env:
          RESULT_DETECT: ${{ needs.detect-changes.result }}
          RESULT_LINT_MD: ${{ needs.check-lint-md.result }}
          RESULT_WORKFLOWS: ${{ needs.check-workflow-files.result }}
          RESULT_STACK: ${{ needs.check-stack-matrix.result }}
          RESULT_DOCS: ${{ needs.check-docs-site.result }}
          RESULT_CONTAINERS: ${{ needs.check-container-build.result }}
          RESULT_MOCK_OAUTH: ${{ needs.check-mock-oauth-build.result }}
          RESULT_AUTH_INTEGRATION: ${{ needs.check-auth-integration.result }}
          RESULT_FLOW_INSIGHTS: ${{ needs.check-flow-insights-equivalence.result }}
          RESULT_MOCK_PROVIDERS: ${{ needs.check-mock-providers.result }}
        run: bash scripts/ci/check-pr-validation-result.sh
