name: Container Latest Tag

on:
  workflow_run:
    workflows: ["Container Publish"]
    types: [completed]

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ourchitecture/idp

jobs:
  retag-latest:
    name: Re-tag highest stable as latest
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Re-tag latest for all images
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail

          IMAGES=(
            "stemix-go-net-http-rest-web"
            "stemix-go-net-http-rest-bff"
            "stemix-nodejs-react-fastify-rest-web"
            "stemix-nodejs-react-fastify-rest-bff"
            "stemix-contract-tests"
          )

          for IMAGE in "${IMAGES[@]}"; do
            FULL="${IMAGE_PREFIX}/${IMAGE}"

            # List all tags, filter stable semver (no pre-release), sort descending
            HIGHEST=$(crane ls "${FULL}" 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 || true)

            if [[ -z "${HIGHEST}" ]]; then
              echo "No stable release found for ${IMAGE}, skipping latest tag"
              continue
            fi

            echo "Re-tagging ${IMAGE}:${HIGHEST} as latest"
            crane tag "${FULL}:${HIGHEST}" latest
          done
