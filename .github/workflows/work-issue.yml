name: Work Issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to signal for agent processing
        required: true
        type: number

permissions:
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

env:
  PROTO_VERSION: "0.55.4"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  signal-ready:
    name: Signal Issue Ready for Agent
    runs-on: ubuntu-latest
    # Only run when agent-eligible label is added via event,
    # or on manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent-eligible'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore proto and moon cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Restore npm cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Determine issue number
        id: issue
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          export EVENT_NAME="${EVENT_NAME}"
          export DISPATCH_ISSUE_NUMBER="${DISPATCH_ISSUE_NUMBER}"
          export EVENT_ISSUE_NUMBER="${EVENT_ISSUE_NUMBER}"
          export OUTPUT_FILE="$GITHUB_OUTPUT"
          moon run repo:issue-number

      - name: Verify issue readiness and post signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          export REPO="${REPO}"
          export ISSUE_NUMBER="${ISSUE_NUMBER}"
          moon run repo:issue-signal-ready

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}
