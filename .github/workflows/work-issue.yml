name: Work Issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to signal for agent processing
        required: true
        type: number

permissions:
  issues: write
  contents: read

env:
  PROTO_VERSION: "0.55.4"

jobs:
  signal-ready:
    name: Signal Issue Ready for Agent
    runs-on: ubuntu-latest
    # Only run when agent-eligible label is added via event,
    # or on manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent-eligible'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Determine issue number
        id: issue
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          export EVENT_NAME="${EVENT_NAME}"
          export DISPATCH_ISSUE_NUMBER="${DISPATCH_ISSUE_NUMBER}"
          export EVENT_ISSUE_NUMBER="${EVENT_ISSUE_NUMBER}"
          export OUTPUT_FILE="$GITHUB_OUTPUT"
          moon run repo:issue-number

      - name: Verify issue readiness and post signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          export REPO="${REPO}"
          export ISSUE_NUMBER="${ISSUE_NUMBER}"
          moon run repo:issue-signal-ready
