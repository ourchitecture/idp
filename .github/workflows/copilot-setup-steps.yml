name: "Copilot Setup Steps"

# Run automatically when this file changes (validates the setup works),
# and allow manual testing from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTO_VERSION: "0.57.1"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  # Job name MUST be `copilot-setup-steps` — Copilot will not pick it up otherwise.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Lowest permissions needed for the setup steps, PLUS the permissions the
    # Copilot agent itself requires for its own GitHub API operations
    # (commenting on issues, adding labels, creating/updating pull requests).
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore proto and moon cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-v2-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.1"
          cache: "pnpm"

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-v2-${{ runner.os }}-${{ hashFiles('.prototools') }}
