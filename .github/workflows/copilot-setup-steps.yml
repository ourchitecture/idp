name: "Copilot Setup Steps"

# Run automatically when this file changes (validates the setup works),
# and allow manual testing from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  PROTO_VERSION: "0.55.4"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  # Job name MUST be `copilot-setup-steps` — Copilot will not pick it up otherwise.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Lowest permissions needed for the setup steps, PLUS the permissions the
    # Copilot agent itself requires for its own GitHub API operations
    # (commenting on issues, adding labels, creating/updating pull requests).
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore proto and moon cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.14.1"
          cache: "npm"

      - name: Install Node.js dependencies
        shell: bash
        run: |
          set -euo pipefail

          install_log="$(mktemp)"
          trap 'rm -f "$install_log"' EXIT

          if npm ci 2>&1 | tee "$install_log"; then
            exit 0
          fi

          if grep -q "package.json and package-lock.json" "$install_log"; then
            echo "::warning::npm ci failed because package.json and package-lock.json are out of sync on this branch. Falling back to npm install --package-lock=false so the agent can start without rewriting the lockfile."
            npm install --package-lock=false
            exit 0
          fi

          exit 1

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}
