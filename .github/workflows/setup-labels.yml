name: Setup Labels

on:
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  PROTO_VERSION: "0.55.4"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  create-labels:
    name: Create Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore proto and moon cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Restore pnpm cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Bootstrap repository labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          export REPO="${REPO}"
          moon run repo:issue-setup-labels

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save pnpm cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
