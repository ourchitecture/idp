name: Issue Triage

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write
  contents: read

env:
  PROTO_VERSION: "0.55.4"

jobs:
  triage:
    name: Triage Issue
    runs-on: ubuntu-latest
    # Skip if the actor is a bot to avoid feedback loops
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Parse issue form fields and apply labels
        env:
          GH_TOKEN: ${{ secrets.IDP_TRIAGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_ACTION: ${{ github.event.action }}
        run: |
          export REPO="${REPO}"
          export ISSUE_NUMBER="${ISSUE_NUMBER}"
          export ISSUE_BODY="${ISSUE_BODY}"
          export ISSUE_AUTHOR="${ISSUE_AUTHOR}"
          export ISSUE_ACTION="${ISSUE_ACTION}"
          moon run repo:issue-triage
