name: Issue Triage

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write
  contents: read

env:
  PROTO_VERSION: "0.55.4"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  triage:
    name: Triage Issue
    runs-on: ubuntu-latest
    # Skip if the actor is a bot to avoid feedback loops
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore proto and moon cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Restore npm cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: ${{ env.PROTO_VERSION }}
          auto-install: true

      - name: Parse issue form fields and apply labels
        env:
          GH_TOKEN: ${{ secrets.IDP_TRIAGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_ACTION: ${{ github.event.action }}
        run: |
          export REPO="${REPO}"
          export ISSUE_NUMBER="${ISSUE_NUMBER}"
          export ISSUE_BODY="${ISSUE_BODY}"
          export ISSUE_AUTHOR="${ISSUE_AUTHOR}"
          export ISSUE_ACTION="${ISSUE_ACTION}"
          moon run repo:issue-triage

      - name: Save proto and moon cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: |
            ~/.proto
            ~/.cache/proto
            ~/.cache/moon
            ~/.moon/cache
            .moon/cache
          key: proto-moon-${{ runner.os }}-${{ hashFiles('.prototools') }}

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docs/package-lock.json', 'tools/mcp/package-lock.json', 'stacks/nodejs/react-fastify/rest/package-lock.json') }}
