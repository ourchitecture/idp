name: Branch Cleanup

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup-orphaned-branches:
    name: Remove orphaned zero-commit branches
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Identify and delete orphaned branches
        env:
          OUTPUT_FILE: ${{ runner.temp }}/branch-cleanup-summary.md
        run: bash scripts/ci/branch-cleanup.sh

      - name: Write step summary
        if: always()
        run: cat "${{ runner.temp }}/branch-cleanup-summary.md" >> "$GITHUB_STEP_SUMMARY"
