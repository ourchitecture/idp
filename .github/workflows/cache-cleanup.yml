name: Cache Cleanup

on:
  workflow_dispatch:
    inputs:
      cache_id:
        description: "Cache ID to delete"
        required: false
        default: ""
      cache_key:
        description: "Cache key to delete"
        required: false
        default: ""
      delete_all:
        description: "Delete all caches (requires confirm_all)"
        type: boolean
        default: false
      confirm_all:
        description: "Confirm deletion when delete_all is true"
        type: boolean
        default: false
      ref:
        description: "Optional ref to scope cache operations"
        required: false
        default: ""
      succeed_on_no_caches:
        description: "Exit success when delete_all finds no caches"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Clean up Actions cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cache cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          args=()
          if [[ "${{ inputs.cache_id }}" != "" ]]; then
            args+=(--id "${{ inputs.cache_id }}")
          fi
          if [[ "${{ inputs.cache_key }}" != "" ]]; then
            args+=(--key "${{ inputs.cache_key }}")
          fi
          if [[ "${{ inputs.delete_all }}" == 'true' ]]; then
            args+=(--all)
          fi
          if [[ "${{ inputs.confirm_all }}" == 'true' ]]; then
            args+=(--confirm-all)
          fi
          if [[ "${{ inputs.ref }}" != "" ]]; then
            args+=(--ref "${{ inputs.ref }}")
          fi
          if [[ "${{ inputs.succeed_on_no_caches }}" == 'true' ]]; then
            args+=(--succeed-on-no-caches)
          fi

          echo "Invoking cache cleanup with args: ${args[*]}"
          scripts/ci/gh-cache-delete.sh "${args[@]}"
