name: Container Cleanup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  packages: write

env:
  # Minimum number of versions to keep per image (floor threshold)
  KEEP_VERSIONS_GO_WEB: "5"
  KEEP_VERSIONS_GO_BFF: "5"
  KEEP_VERSIONS_NODE_WEB: "5"
  KEEP_VERSIONS_NODE_BFF: "5"
  KEEP_VERSIONS_TESTS: "5"
  KEEP_VERSIONS_MCP: "5"
  KEEP_VERSIONS_MOCK_OAUTH: "5"

jobs:
  cleanup:
    name: Clean up old package versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: stemix-go-net-http-rest-web
            keep_env: KEEP_VERSIONS_GO_WEB
          - package: stemix-go-net-http-rest-bff
            keep_env: KEEP_VERSIONS_GO_BFF
          - package: stemix-nodejs-react-fastify-rest-web
            keep_env: KEEP_VERSIONS_NODE_WEB
          - package: stemix-nodejs-react-fastify-rest-bff
            keep_env: KEEP_VERSIONS_NODE_BFF
          - package: stemix-contract-tests
            keep_env: KEEP_VERSIONS_TESTS
          - package: stemix-mcp-server
            keep_env: KEEP_VERSIONS_MCP
          - package: stemix-mock-oauth
            keep_env: KEEP_VERSIONS_MOCK_OAUTH
    steps:
      - name: Delete old container versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: idp/${{ matrix.package }}
          package-type: container
          min-versions-to-keep: ${{ env[matrix.keep_env] }}
          delete-only-untagged-versions: false
          ignore-versions: "^(latest|edge|\\d+|\\d+\\.\\d+)$"
