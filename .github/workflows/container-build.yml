name: Container Build

on:
  pull_request:
    branches: [main]
    paths:
      - "stacks/go/net-http/rest/**"
      - "stacks/nodejs/react-fastify/rest/**"
      - "tests/**"
      - "tools/mcp/**"
      - "tools/mock-oauth/**"
      - ".github/workflows/container-build.yml"
  push:
    branches: [main]
    paths:
      - "stacks/go/net-http/rest/**"
      - "stacks/nodejs/react-fastify/rest/**"
      - "tests/**"
      - "tools/mcp/**"
      - "tools/mock-oauth/**"
      - ".github/workflows/container-build.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ourchitecture/idp

jobs:
  detect-changes:
    name: Detect Container Scope
    runs-on: ubuntu-latest
    outputs:
      run_go_containers: ${{ steps.scope.outputs.run_go_containers }}
      run_node_containers: ${{ steps.scope.outputs.run_node_containers }}
      run_tests_container: ${{ steps.scope.outputs.run_tests_container }}
      run_mcp_containers: ${{ steps.scope.outputs.run_mcp_containers }}
      run_mock_oauth_containers: ${{ steps.scope.outputs.run_mock_oauth_containers }}
      run_any_containers: ${{ steps.scope.outputs.run_any_containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Detect changed container scopes
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          BASE_SHA="${BASE_SHA}" \
            HEAD_SHA="${HEAD_SHA}" \
            OUTPUT_FILE="${GITHUB_OUTPUT}" \
            bash ./scripts/ci/detect-container-changes.sh

  build-go-web:
    name: Build go-net-http-rest-web
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_go_containers == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: stacks/go/net-http/rest
          file: stacks/go/net-http/rest/Dockerfile
          build-args: SERVICE=web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            stemix-go-net-http-rest-web:pr-check
            ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-web:edge
          cache-from: type=gha,scope=go-net-http-rest-web,timeout=10m
          cache-to: type=gha,scope=go-net-http-rest-web,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          CID=$(docker run -d -p 3300:3000 stemix-go-net-http-rest-web:pr-check)
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3300/ || true)
          docker stop "${CID}" || true
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Smoke test failed: HTTP ${STATUS}"
            exit 1
          fi

  build-go-bff:
    name: Build go-net-http-rest-bff
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_go_containers == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: stacks/go/net-http/rest
          file: stacks/go/net-http/rest/Dockerfile
          build-args: SERVICE=bff
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            stemix-go-net-http-rest-bff:pr-check
            ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-bff:edge
          cache-from: type=gha,scope=go-net-http-rest-bff,timeout=10m
          cache-to: type=gha,scope=go-net-http-rest-bff,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          CID=$(docker run -d -p 8300:8000 stemix-go-net-http-rest-bff:pr-check)
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8300/health || true)
          docker stop "${CID}" || true
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Smoke test failed: HTTP ${STATUS}"
            exit 1
          fi

  build-nodejs-web:
    name: Build nodejs-react-fastify-rest-web
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_node_containers == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stacks/nodejs/react-fastify/rest/web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            stemix-nodejs-react-fastify-rest-web:pr-check
            ${{ env.IMAGE_PREFIX }}/stemix-nodejs-react-fastify-rest-web:edge
          cache-from: type=gha,scope=nodejs-react-fastify-rest-web,timeout=10m
          cache-to: type=gha,scope=nodejs-react-fastify-rest-web,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          CID=$(docker run -d -p 3400:3000 -e BFF_URL=http://localhost:8400 stemix-nodejs-react-fastify-rest-web:pr-check)
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3400/ || true)
          docker stop "${CID}" || true
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Smoke test failed: HTTP ${STATUS}"
            exit 1
          fi

  build-nodejs-bff:
    name: Build nodejs-react-fastify-rest-bff
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_node_containers == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stacks/nodejs/react-fastify/rest/bff/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            stemix-nodejs-react-fastify-rest-bff:pr-check
            ${{ env.IMAGE_PREFIX }}/stemix-nodejs-react-fastify-rest-bff:edge
          cache-from: type=gha,scope=nodejs-react-fastify-rest-bff,timeout=10m
          cache-to: type=gha,scope=nodejs-react-fastify-rest-bff,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          CID=$(docker run -d -p 8400:8000 stemix-nodejs-react-fastify-rest-bff:pr-check)
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8400/health || true)
          docker stop "${CID}" || true
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Smoke test failed: HTTP ${STATUS}"
            exit 1
          fi

  build-contract-tests:
    name: Build contract-tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_tests_container == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/stemix-contract-tests:edge
          cache-from: type=gha,scope=contract-tests,timeout=10m
          cache-to: type=gha,scope=contract-tests,mode=max,ignore-error=true,timeout=10m

  build-mcp-server:
    name: Build mcp-tools
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_mcp_containers == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: tools/mcp
          file: tools/mcp/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            stemix-mcp-server:pr-check
            ${{ env.IMAGE_PREFIX }}/stemix-mcp-server:edge
          cache-from: type=gha,scope=mcp-tools,timeout=10m
          cache-to: type=gha,scope=mcp-tools,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          CID=$(docker run -d -p 8580:8080 stemix-mcp-server:pr-check)
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8580/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke-test","version":"0.0.1"}}}' \
            || true)
          docker stop "${CID}" || true
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Smoke test failed: HTTP ${STATUS}"
            exit 1
          fi

  build-mock-oauth:
    name: Build mock-oauth
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_mock_oauth_containers == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: tools/mock-oauth
          file: tools/mock-oauth/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            stemix-mock-oauth:pr-check
            ${{ env.IMAGE_PREFIX }}/stemix-mock-oauth:edge
          cache-from: type=gha,scope=mock-oauth,timeout=10m
          cache-to: type=gha,scope=mock-oauth,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          CID=$(docker run -d -p 9900:9000 stemix-mock-oauth:pr-check)
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9900/health || true)
          docker stop "${CID}" || true
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Smoke test failed: HTTP ${STATUS}"
            exit 1
          fi

  container-build-result:
    name: Container Build Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - build-go-web
      - build-go-bff
      - build-nodejs-web
      - build-nodejs-bff
      - build-contract-tests
      - build-mcp-server
      - build-mock-oauth
    steps:
      - name: Verify all container builds passed
        run: |
          result_detect="${{ needs.detect-changes.result }}"
          result_go_web="${{ needs.build-go-web.result }}"
          result_go_bff="${{ needs.build-go-bff.result }}"
          result_node_web="${{ needs.build-nodejs-web.result }}"
          result_node_bff="${{ needs.build-nodejs-bff.result }}"
          result_tests="${{ needs.build-contract-tests.result }}"
          result_mcp="${{ needs.build-mcp-server.result }}"
          result_mock_oauth="${{ needs.build-mock-oauth.result }}"

          failed="false"
          for result in "${result_detect}" "${result_go_web}" "${result_go_bff}" "${result_node_web}" "${result_node_bff}" "${result_tests}" "${result_mcp}" "${result_mock_oauth}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              failed="true"
            fi
          done

          if [[ "${failed}" == "true" ]]; then
            echo "::error::One or more container builds failed"
            exit 1
          fi

          echo "All container builds completed successfully."
