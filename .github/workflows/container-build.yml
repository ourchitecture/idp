        with:
          images: ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-bff
          tags: |
            type=raw,value=pr-check
            type=raw,value=edge
          labels: |
            org.opencontainers.image.vendor=Ourchitecture
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/ourchitecture/idp
            org.opencontainers.image.source=https://github.com/ourchitecture/idp

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: stacks/go/net-http/rest
          file: stacks/go/net-http/rest/Dockerfile
          build-args: |
            SERVICE=bff
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            VERSION=${{ env.VERSION_LABEL }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=go-net-http-rest-bff,timeout=10m
          cache-to: type=gha,scope=go-net-http-rest-bff,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-bff:pr-check
          PORT: "8300:8000"
          URL: http://localhost:8300/health
        run: bash scripts/ci/smoke-test-container.sh

  build-nodejs-web:
