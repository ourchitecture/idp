name: Container Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "stacks/go/net-http/rest/**"
      - "stacks/nodejs/react-fastify/rest/**"
      - "tests/**"
      - "tools/mcp/**"
      - "tools/mock-oauth/**"
      - ".devcontainer/**"
      - ".prototools"
      - ".github/workflows/container-build.yml"
  push:
    branches: [main]
    paths:
      - "stacks/go/net-http/rest/**"
      - "stacks/nodejs/react-fastify/rest/**"
      - "tests/**"
      - "tools/mcp/**"
      - "tools/mock-oauth/**"
      - ".devcontainer/**"
      - ".prototools"
      - ".github/workflows/container-build.yml"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ourchitecture/idp

jobs:
  detect-changes:
    name: Detect Container Scope
    runs-on: ubuntu-latest
    outputs:
      run_go_containers: ${{ steps.scope.outputs.run_go_containers }}
      run_node_containers: ${{ steps.scope.outputs.run_node_containers }}
      run_tests_container: ${{ steps.scope.outputs.run_tests_container }}
      run_mcp_containers: ${{ steps.scope.outputs.run_mcp_containers }}
      run_mock_oauth_containers: ${{ steps.scope.outputs.run_mock_oauth_containers }}
      run_dev_tools_container: ${{ steps.scope.outputs.run_dev_tools_container }}
      run_any_containers: ${{ steps.scope.outputs.run_any_containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed container scopes
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          BASE_SHA="${BASE_SHA}" \
            HEAD_SHA="${HEAD_SHA}" \
            OUTPUT_FILE="${GITHUB_OUTPUT}" \
            bash ./scripts/ci/detect-container-changes.sh

  build-go-web:
    name: Build go-net-http-rest-web
    runs-on: ubuntu-latest
    needs: [detect-changes]
    env:
      VERSION_LABEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'edge' }}
    if: >
      needs.detect-changes.outputs.run_go_containers == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-web
          tags: |
            type=raw,value=pr-check
            type=raw,value=edge
          labels: |
            org.opencontainers.image.vendor=Ourchitecture
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/ourchitecture/idp
            org.opencontainers.image.source=https://github.com/ourchitecture/idp

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: stacks/go/net-http/rest
          file: stacks/go/net-http/rest/Dockerfile
          build-args: |
            SERVICE=web
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            VERSION=${{ env.VERSION_LABEL }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=go-net-http-rest-web,timeout=10m
          cache-to: type=gha,scope=go-net-http-rest-web,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-web:pr-check
          PORT: "3300:3000"
          URL: http://localhost:3300/
        run: bash scripts/ci/smoke-test-container.sh

