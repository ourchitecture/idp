      VERSION_LABEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'edge' }}
    if: >
      needs.detect-changes.outputs.run_dev_tools_container == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/stemix-dev-tools
          tags: |
            type=raw,value=pr-check
            type=raw,value=edge
          labels: |
            org.opencontainers.image.vendor=Ourchitecture
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/ourchitecture/idp
            org.opencontainers.image.source=https://github.com/ourchitecture/idp

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            VERSION=${{ env.VERSION_LABEL }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=dev-tools,timeout=10m
          cache-to: type=gha,scope=dev-tools,mode=max,ignore-error=true,timeout=10m

      - name: Smoke test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.IMAGE_PREFIX }}/stemix-dev-tools:pr-check bash -c \
            "proto --version && moon --version && go version && node --version && \
             python --version && java --version && make --version && docker --version"

  container-build-result:
    name: Container Build Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - build-go-web
      - build-go-bff
      - build-nodejs-web
      - build-nodejs-bff
      - build-contract-tests
      - build-mcp-server
      - build-mock-oauth
      - build-dev-tools
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify all container builds passed
        env:
          RESULT_DETECT: ${{ needs.detect-changes.result }}
          RESULT_GO_WEB: ${{ needs.build-go-web.result }}
          RESULT_GO_BFF: ${{ needs.build-go-bff.result }}
          RESULT_NODE_WEB: ${{ needs.build-nodejs-web.result }}
          RESULT_NODE_BFF: ${{ needs.build-nodejs-bff.result }}
          RESULT_TESTS: ${{ needs.build-contract-tests.result }}
          RESULT_MCP: ${{ needs.build-mcp-server.result }}
          RESULT_MOCK_OAUTH: ${{ needs.build-mock-oauth.result }}
          RESULT_DEV_TOOLS: ${{ needs.build-dev-tools.result }}
        run: bash scripts/ci/check-container-build-result.sh
