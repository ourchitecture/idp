name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      go_net_http_rest_released: ${{ steps.release.outputs['stacks/go/net-http/rest--release_created'] }}
      go_net_http_rest_tag: ${{ steps.release.outputs['stacks/go/net-http/rest--tag_name'] }}
      nodejs_react_fastify_rest_released: ${{ steps.release.outputs['stacks/nodejs/react-fastify/rest--release_created'] }}
      nodejs_react_fastify_rest_tag: ${{ steps.release.outputs['stacks/nodejs/react-fastify/rest--tag_name'] }}
      contract_tests_released: ${{ steps.release.outputs['tests--release_created'] }}
      contract_tests_tag: ${{ steps.release.outputs['tests--tag_name'] }}
      mcp_tools_released: ${{ steps.release.outputs['tools/mcp--release_created'] }}
      mcp_tools_tag: ${{ steps.release.outputs['tools/mcp--tag_name'] }}
      backstage_tools_released: ${{ steps.release.outputs['tools/backstage--release_created'] }}
      backstage_tools_tag: ${{ steps.release.outputs['tools/backstage--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-backstage-plugins:
    name: Publish Backstage Plugins
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.backstage_tools_released == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          proto-version: "0.57.1"
          auto-install: true

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-backstage-plugins.sh
