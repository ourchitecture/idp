      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#dev-tools-v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          MINOR="${MINOR#*.}"
          {
            echo "version=${VERSION}"
