            ${{ env.IMAGE_PREFIX }}/stemix-mock-oauth:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_PREFIX }}/stemix-mock-oauth:${{ steps.version.outputs.major }}
          cache-from: type=gha,scope=mock-oauth,timeout=10m
          cache-to: type=gha,scope=mock-oauth,mode=max,ignore-error=true,timeout=10m

  publish-dev-tools:
    name: Publish dev-tools container
    if: startsWith(github.ref_name, 'dev-tools-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
