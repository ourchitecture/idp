name: Container Publish

on:
  push:
    tags:
      - "go-net-http-rest-v*"
      - "nodejs-react-fastify-rest-v*"
      - "contract-tests-v*"
      - "mcp-tools-v*"
      - "mock-oauth-v*"
      - "dev-tools-v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ourchitecture/idp

jobs:
  publish-go-net-http-rest:
    name: Publish go-net-http-rest containers
    if: startsWith(github.ref_name, 'go-net-http-rest-v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, bff]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          PREFIX: go-net-http-rest-v
        run: OUTPUT_FILE="$GITHUB_OUTPUT" bash scripts/ci/extract-container-version.sh

      - name: Extract metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }}
          labels: |
            org.opencontainers.image.vendor=Ourchitecture
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/ourchitecture/idp
            org.opencontainers.image.source=https://github.com/ourchitecture/idp

      - name: Build and push versioned image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: stacks/go/net-http/rest
          file: stacks/go/net-http/rest/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=go-net-http-rest-${{ matrix.service }},timeout=10m
          cache-to: type=gha,scope=go-net-http-rest-${{ matrix.service }},mode=max,ignore-error=true,timeout=10m

  publish-nodejs-react-fastify-rest:
    name: Publish nodejs-react-fastify-rest containers
    if: startsWith(github.ref_name, 'nodejs-react-fastify-rest-v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web
            dockerfile: stacks/nodejs/react-fastify/rest/web/Dockerfile
          - service: bff
            dockerfile: stacks/nodejs/react-fastify/rest/bff/Dockerfile
