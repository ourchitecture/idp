name: Container Publish

on:
  push:
    tags:
      - "go-net-http-rest-v*"
      - "nodejs-react-fastify-rest-v*"
      - "contract-tests-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ourchitecture/idp

jobs:
  publish-go-net-http-rest:
    name: Publish go-net-http-rest containers
    if: startsWith(github.ref_name, 'go-net-http-rest-v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, bff]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#go-net-http-rest-v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          MINOR="${MINOR#*.}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stacks/go/net-http/rest/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-${{ matrix.service }}:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_PREFIX }}/stemix-go-net-http-rest-${{ matrix.service }}:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-nodejs-react-fastify-rest:
    name: Publish nodejs-react-fastify-rest containers
    if: startsWith(github.ref_name, 'nodejs-react-fastify-rest-v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web
            dockerfile: stacks/nodejs/react-fastify/rest/web/Dockerfile
          - service: bff
            dockerfile: stacks/nodejs/react-fastify/rest/bff/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#nodejs-react-fastify-rest-v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          MINOR="${MINOR#*.}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/stemix-nodejs-react-fastify-rest-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/stemix-nodejs-react-fastify-rest-${{ matrix.service }}:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_PREFIX }}/stemix-nodejs-react-fastify-rest-${{ matrix.service }}:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-contract-tests:
    name: Publish contract-tests container
    if: startsWith(github.ref_name, 'contract-tests-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#contract-tests-v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          MINOR="${MINOR#*.}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/stemix-contract-tests:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/stemix-contract-tests:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_PREFIX }}/stemix-contract-tests:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
