language: "typescript"
layer: "application"
stack: "frontend"

project:
  title: "docs-site"
  description: "Stemix documentation site built with Docusaurus 3."

tasks:
  all:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check"]
  install:
    command: ["bash", "-c", "PUPPETEER_SKIP_DOWNLOAD=true npm ci"]
  build:
    command: ["npm", "run", "build"]
    deps: ["install"]
  clean:
    command: ["bash", "-c", "rm -rf build .docusaurus"]
  generate-diagrams:
    command: ["npm", "run", "generate:diagrams"]
  install-ci-browsers:
    command: ["bash", "-c", "node_modules/.bin/puppeteer browsers install chrome"]
    deps: ["install"]
  check-diagrams:
    command: ["npm", "run", "check:diagrams"]
    deps: ["install"]
  check-diagrams-ci:
    command: ["npm", "run", "check:diagrams"]
    deps: ["install-ci-browsers"]
  check-lint:
    command: ["npm", "run", "lint:md"]
    deps: ["install"]
  check-test:
    command: ["npm", "run", "typecheck"]
    deps: ["install"]
  check-ci:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check-diagrams-ci", "check-lint", "check-test"]
    options:
      runInCI: true
  check:
    command: ["bash", "-c", "true"]
    deps: ["check-diagrams", "check-lint", "check-test"]
  run-dev:
    command: ["npm", "run", "start"]
    options:
      persistent: true
      runInCI: false
  run-serve:
    command: ["npm", "run", "serve"]
    options:
      persistent: true
      runInCI: false
