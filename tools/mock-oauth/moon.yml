language: "java"
layer: "tool"
stack: "backend"

project:
  title: "mock-oauth"
  description: "Mock OAuth 2.0 service for automated contract testing of the Go BFF auth flow. Test-only; never deployed to production."

tasks:
  all:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check"]
  install:
    command: ["./mvnw", "dependency:resolve", "-q", "-B"]
  build:
    command: ["./mvnw", "package", "-q", "-DskipTests"]
  clean:
    command: ["./mvnw", "clean", "-q"]
  check-lint:
    command: ["bash", "-c", "echo 'No additional lint configured for mock-oauth'"]
  check-test:
    command: ["./mvnw", "verify", "-q"]
  check-ci:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check-test"]
    options:
      runInCI: true
  check:
    command: ["bash", "-c", "true"]
    deps: ["check-lint", "check-test"]
  test:
    command: ["bash", "-c", "true"]
    deps: ["check-test"]
  run:
    command: ["bash", "-c", "MOCK_OAUTH_PORT=9000 ./mvnw spring-boot:run -q"]
    options:
      persistent: true
      runInCI: false
  build-container:
    command: ["docker", "build", "-t", "localhost/stemix-mock-oauth:latest", "."]
    options:
      runInCI: false
