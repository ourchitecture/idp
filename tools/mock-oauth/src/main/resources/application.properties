# Mock OAuth service configuration.
# This service is test-only and is never deployed to production.

# Port is configurable via the OUR_IDP_OAUTH_MOCK_PORT environment variable; default is 9000.
server.port=${OUR_IDP_OAUTH_MOCK_PORT:9000}

spring.application.name=mock-oauth

# Suppress the Spring Boot banner in logs to keep test output clean.
spring.main.banner-mode=off

# Reduce log verbosity for automated test runs.
logging.level.root=WARN
logging.level.dev.idp.mockoauth=INFO
