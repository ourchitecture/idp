language: "typescript"
layer: "tool"
stack: "backend"

project:
  title: "mcp-tools"
  description: "MCP adapter server for the Stemix Intent-Driven Portal BFF."

tasks:
  all:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check"]
  install:
    command: ["bash", "-c", "true"]
    deps: ["repo:install"]
  build:
    command: ["pnpm", "run", "build"]
    deps: ["install"]
  clean:
    command: ["bash", "-c", "rm -rf dist"]
  check-lint:
    command: ["bash", "-c", "echo 'No additional lint configured for mcp-tools'"]
  check-test:
    command: ["pnpm", "run", "typecheck"]
    deps: ["install"]
  check-contract:
    command: ["bash", "-c", "pnpm -C ../.. install && OUR_IDP_MCP_PORT=8580 IDP_BFF_URL=http://127.0.0.1:8300 node dist/server.js >/dev/null 2>&1 & MCP_PID=$!; trap 'kill $MCP_PID >/dev/null 2>&1 || true' EXIT; sleep 2; IDP_MCP_URL=http://127.0.0.1:8580 IDP_STACK_PATH=tools/mcp IDP_CONTRACT_PROFILES=mcp-profile pnpm -C ../.. run test:contract; STATUS=$?; kill $MCP_PID >/dev/null 2>&1 || true; wait $MCP_PID 2>/dev/null || true; exit $STATUS"]
  check-ci:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check-test"]
    options:
      runInCI: true
  check:
    command: ["bash", "-c", "true"]
    deps: ["check-lint", "check-test", "check-contract"]
  test:
    command: ["bash", "-c", "true"]
    deps: ["check-test"]
  test-contract:
    command: ["bash", "-c", "true"]
    deps: ["check-contract"]
  run:
    command: ["node", "dist/server.js"]
    options:
      persistent: true
      runInCI: false
  run-http:
    command: ["bash", "-c", "OUR_IDP_MCP_PORT=8080 node dist/server.js"]
    options:
      persistent: true
      runInCI: false
  build-container:
    command: ["docker", "build", "-t", "localhost/stemix-mcp-server:latest", "-f", "../../tools/mcp/Dockerfile", "../.."]
    options:
      runInCI: false
