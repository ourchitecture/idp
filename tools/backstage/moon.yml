language: "typescript"
layer: "tool"
stack: "backend"

project:
  title: "backstage-tools"
  description: "Backstage test harness for Stemix IDP plug-in integration."

tasks:
  # Override moon's inherited npm install to prevent interference with yarn workspace
  node-install-deps:
    command: ["bash", "-c", "true"]

  all:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check"]

  install:
    # Execute yarn install in the backstage directory context to respect workspace
    command: ["bash", "-c", "cd $MOON_PROJECT_ROOT && yarn install"]

  build:
    command: ["bash", "-c", "cd $MOON_PROJECT_ROOT && yarn build:all"]
    deps: ["install"]

  clean:
    command: ["bash", "-c", "cd $MOON_PROJECT_ROOT && rm -rf dist dist-types node_modules packages/*/dist packages/*/node_modules"]

  check-lint:
    command: ["bash", "-c", "echo 'No additional lint configured for backstage-tools'"]

  check-test:
    command: ["bash", "-c", "cd $MOON_PROJECT_ROOT && yarn typecheck"]
    deps: ["install"]

  check-ci:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check-test"]
    options:
      runInCI: true

  check:
    command: ["bash", "-c", "true"]
    deps: ["check-lint", "check-test"]

  test:
    command: ["bash", "-c", "true"]
    deps: ["check-test"]

  dev:
    command: ["bash", "-c", "cd $MOON_PROJECT_ROOT && yarn dev"]
    options:
      persistent: true
      runInCI: false

  run:
    command: ["bash", "-c", "cd $MOON_PROJECT_ROOT && yarn dev"]
    options:
      persistent: true
      runInCI: false
