language: "typescript"
layer: "tool"
stack: "backend"

# Keep Backstage isolated from the repo-root pnpm workspace bootstrap.
toolchains:
  default: "system"
  javascript: false
  node: false
  npm: false
  pnpm: false

project:
  title: "backstage-tools"
  description: "Backstage test harness for Stemix IDP plug-in integration."

tasks:
  # Override moon's inherited install task; this tool manages its own Yarn workspace.
  node-install-deps:
    command: ["bash", "-c", "true"]

  all:
    command: ["bash", "-c", "true"]
    deps: ["install", "build", "check"]

  install:
    command: ["bash", "-lc", "corepack enable && yarn install"]

  build:
    command: ["bash", "-lc", "corepack enable && yarn run build:all"]
    deps: ["install"]

  build-stemix:
    command: ["bash", "-lc", "corepack enable && yarn run build:stemix"]
    deps: ["install"]

  clean:
    command: ["bash", "-c", "rm -rf dist dist-types node_modules packages/*/dist packages/*/node_modules plugins/*/dist plugins/*/dist-types plugins/*/node_modules"]

  check-lint:
    command: ["bash", "-lc", "corepack enable && yarn run fix:check"]
    deps: ["install"]

  check-test:
    command: ["bash", "-lc", "corepack enable && yarn run typecheck && yarn run test:stemix"]
    deps: ["install"]

  check-ci:
    command: ["bash", "-c", "true"]
    deps: ["install", "build-stemix", "check-lint", "check-test"]
    options:
      runInCI: true

  check:
    command: ["bash", "-c", "true"]
    deps: ["check-lint", "check-test"]

  test:
    command: ["bash", "-c", "true"]
    deps: ["check-test"]

  dev:
    command: ["bash", "-lc", "corepack enable && yarn run dev"]
    options:
      persistent: true
      runInCI: false

  run:
    command: ["bash", "-lc", "corepack enable && yarn run dev"]
    options:
      persistent: true
      runInCI: false

  check-stemix:
    command: ["bash", "-lc", "corepack enable && yarn run check:stemix"]
    deps: ["install"]
