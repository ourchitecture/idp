language: "typescript"
layer: "automation"
stack: "backend"

project:
  title: "contract-tests"
  description: "Implementation-agnostic contract test harness for IDP stacks."

tasks:
  check-contract:
    command: ["pnpm", "run", "test:contract"]
    options:
      runFromWorkspaceRoot: true
  test-contract:
    command: ["pnpm", "run", "test:contract"]
    options:
      runFromWorkspaceRoot: true
  build-container:
    command: ["docker", "build", "-t", "localhost/stemix-contract-tests:latest", "-f", "Dockerfile", ".."]
    options:
      runInCI: false
